services:
  - type: web
    name: ruteo-extractor-service
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DRIVE_FOLDER_ID
        value: 1qpXukDfaovrVltV74NL9WpBzr1Ig916z
      - key: SPREADSHEET_ID
        value: 1eQ9Y5diL5fwxYTxvseNgZJFbX-lSUQ13axbp3cLiqPc
      - key: ENABLE_AUTO_TRIGGER
        value: "true"
      - key: EXTRACTION_INTERVAL_MINUTES
        value: "5"
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
