<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Choferes - Ruteo Novedades</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #121212;
      --card-blue: #93c5fd;
      --card-salmon: #f87171;
      --text-dark: #0f172a;
      --text-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenedor Mockup de Teléfono Móvil */
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border-radius: 24px;
      border: 2px solid #334155;
    }

    @media (max-width: 480px) {
      .mobile-frame {
        border-radius: 0;
        border: none;
        height: 100vh;
        max-height: none;
      }
    }

    /* PANTALLA LOGIN */
    .screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .login-container {
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      gap: 1.5rem;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      color: #38bdf8;
    }

    .login-sub {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .input-group input {
      padding: 0.9rem;
      border-radius: 12px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn-login {
      padding: 1rem;
      border-radius: 12px;
      border: none;
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background-color: #2563eb;
    }

    /* HEADER DE LA APP (DIAGRAMA) */
    .app-header {
      background-color: #000000;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      border-bottom: 1px solid #1e293b;
    }

    .app-logo {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.65rem;
      gap: 2px;
    }

    .icon-btn i {
      font-size: 1rem;
    }

    /* BARRA NOMBRE CHOFER */
    .driver-bar {
      background-color: #000000;
      padding: 0.6rem 1.25rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #1e293b;
    }

    /* CARD DE ASIGNACIÓN PRINCIPAL (DIAGRAMA) */
    .card-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      transition: background-color 0.4s ease;
      color: #000000;
    }

    .card-theme-blue {
      background-color: var(--card-blue);
    }

    .card-theme-salmon {
      background-color: var(--card-salmon);
    }

    .terminal-label {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .terminal-name {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 0.5rem;
      line-height: 1.1;
      max-width: 90%;
    }

    .info-row {
      display: flex;
      gap: 2.5rem;
      margin-top: 2rem;
      font-weight: 700;
      font-size: 1.2rem;
    }

    /* BOTONES THUMBS FEEDBACK (👍 👎) */
    .feedback-row {
      display: flex;
      gap: 3rem;
      margin-top: 3.5rem;
    }

    .btn-thumb {
      background: none;
      border: none;
      font-size: 3.5rem;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-thumb:hover {
      transform: scale(1.2);
    }

    .btn-thumb:active {
      transform: scale(0.95);
    }

    .btn-thumb.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .status-badge {
      margin-top: 2rem;
      padding: 0.5rem 1.2rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.85rem;
      background-color: rgba(0, 0, 0, 0.15);
      text-transform: uppercase;
    }

    /* BOTTON NAVIGATION BAR (DIAGRAMA) */
    .bottom-nav {
      background-color: #e2e8f0;
      height: 65px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      border-top: 1px solid #cbd5e1;
    }

    .nav-item {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #475569;
      font-size: 1.3rem;
      border-right: 1px solid #cbd5e1;
    }

    .nav-item:last-child {
      border-right: none;
    }

    .nav-item.active {
      color: #000000;
      background-color: #cbd5e1;
    }

    .no-assignment {
      font-size: 1.2rem;
      font-weight: 600;
      color: #475569;
    }
  </style>
</head>
<body>

<div class="mobile-frame">

  <!-- 1. PANTALLA LOGIN -->
  <div id="screenLogin" class="screen">
    <div class="login-container">
      <div>
        <div class="login-title">APP NOVEDADES</div>
        <div class="login-sub">Acceso para Choferes de Ruteo</div>
      </div>

      <div class="input-group">
        <label>ID Chofer o DNI</label>
        <input type="text" id="loginId" placeholder="Ej: drv_0012 o Nombre" value="SANDOVAL">
      </div>

      <div class="input-group">
        <label>Contraseña APP NOVEDADES</label>
        <input type="password" id="loginPass" placeholder="Opcional (DB_CHOFERES)">
      </div>

      <button class="btn-login" onclick="ejecutarLogin()">INGRESAR AL RUTEO</button>
      <div id="loginError" style="color: #f87171; font-size: 0.85rem; text-align: center;"></div>
    </div>
  </div>

  <!-- 2. PANTALLA PRINCIPAL ASIGNACIÓN -->
  <div id="screenApp" class="screen hidden">
    <!-- HEADER -->
    <div class="app-header">
      <div class="app-logo">LOGO</div>
      <div class="header-actions">
        <button class="icon-btn">
          <i class="fa-regular fa-bell"></i>
          <span>NOTIFICACIÓN</span>
        </button>
        <button class="icon-btn" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>LOG OUT</span>
        </button>
      </div>
    </div>

    <!-- DRIVER BAR -->
    <div id="driverBar" class="driver-bar">SANDOVAL REYES CRISTIAN EDUARDO</div>

    <!-- MAIN CARD CONTENT -->
    <div id="cardContent" class="card-content card-theme-blue">
      <div class="terminal-label">TERMINAL</div>
      <div id="terminalName" class="terminal-name">PLAZA HUINCUL</div>

      <div class="info-row">
        <span id="fechaObj">23/07</span>
        <span id="horario">15 HS</span>
      </div>

      <!-- THUMBS FEEDBACK (👍 👎) -->
      <div class="feedback-row">
        <button id="btnThumbUp" class="btn-thumb" onclick="enviarFeedback('CONFIRMADO')">👍</button>
        <button id="btnThumbDown" class="btn-thumb" onclick="enviarFeedback('RECHAZADO')">👎</button>
      </div>

      <div id="statusBadge" class="status-badge">PENDIENTE DE CONFIRMACIÓN</div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="nav-item active"><i class="fa-solid fa-truck-ramp-box"></i></div>
      <div class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div class="nav-item"><i class="fa-solid fa-comment-dots"></i></div>
      <div class="nav-item"><i class="fa-solid fa-user"></i></div>
    </div>
  </div>

</div>

<script>
  let currentChofer = null;
  let currentNovedadId = null;

  async function ejecutarLogin() {
    const idVal = document.getElementById('loginId').value.trim();
    const passVal = document.getElementById('loginPass').value.trim();
    const errDiv = document.getElementById('loginError');

    if (!idVal) {
      errDiv.textContent = 'Ingrese su ID de chofer o nombre';
      return;
    }

    errDiv.textContent = 'Autenticando en DB_CHOFERES...';

    try {
      const res = await fetch('/api/ruteo/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_chofer: idVal, password: passVal })
      });

      const data = await res.json();

      if (data.success && data.chofer) {
        currentChofer = data.chofer;
        errDiv.textContent = '';
        mostrarApp(data);
      } else {
        errDiv.textContent = data.error || 'Autenticación fallida';
      }
    } catch (e) {
      errDiv.textContent = 'Error de conexión con el servidor';
    }
  }

  function mostrarApp(data) {
    document.getElementById('screenLogin').classList.add('hidden');
    document.getElementById('screenApp').classList.remove('hidden');

    document.getElementById('driverBar').textContent = currentChofer.nombre;

    const datos = data.datos;
    const card = document.getElementById('cardContent');

    if (!datos) {
      card.className = 'card-content';
      card.innerHTML = `<div class="no-assignment">No tienes ruteos asignados para hoy.</div>`;
      return;
    }

    currentNovedadId = datos.id_novedad;
    document.getElementById('terminalName').textContent = datos.terminal;
    document.getElementById('fechaObj').textContent = datos.fecha_objetivo;
    document.getElementById('horario').textContent = datos.horario;

    // Asignar color de tarjeta según Terminal (Azul para Plaza Huincul, Salmon/Rojo para Dock Sud)
    const termUpper = (datos.terminal || '').toUpperCase();
    if (termUpper.includes('DOCK') || termUpper.includes('SUD')) {
      card.className = 'card-content card-theme-salmon';
    } else {
      card.className = 'card-content card-theme-blue';
    }

    actualizarBadge(datos.estado_recepcion);
  }

  function actualizarBadge(estado) {
    const badge = document.getElementById('statusBadge');
    const bUp = document.getElementById('btnThumbUp');
    const bDown = document.getElementById('btnThumbDown');

    if (estado === 'CONFIRMADO') {
      badge.textContent = '👍 CONFIRMADO';
      badge.style.backgroundColor = 'rgba(16, 185, 129, 0.3)';
    } else if (estado === 'RECHAZADO') {
      badge.textContent = '👎 RECHAZADO';
      badge.style.backgroundColor = 'rgba(239, 68, 68, 0.3)';
    } else {
      badge.textContent = 'PENDIENTE DE CONFIRMACIÓN';
      badge.style.backgroundColor = 'rgba(0, 0, 0, 0.15)';
    }
  }

  async function enviarFeedback(estado) {
    if (!currentChofer || !currentNovedadId) return;

    try {
      actualizarBadge(estado);
      const res = await fetch('/api/ruteo/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          novedadId: currentNovedadId,
          choferId: currentChofer.id,
          estado: estado
        })
      });

      const data = await res.json();
      if (!data.success) {
        alert('Error al registrar feedback en la planilla: ' + data.error);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function logout() {
    currentChofer = null;
    currentNovedadId = null;
    document.getElementById('screenApp').classList.add('hidden');
    document.getElementById('screenLogin').classList.remove('hidden');
  }
</script>

</body>
</html>
